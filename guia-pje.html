<style>
/* ============================================================
   GUIA CDD 001/2026 — PRIMEIRO ACESSO AOS SISTEMAS PROCESSUAIS
   Comissão de Direito Digital · OAB/PA · Subseção Marabá

   Arquitetura em três camadas que não se tocam:
     1. DADOS      — script#dados (bloco JSON no corpo)
     2. DOCUMENTO  — seções roláveis montadas por JS a partir dos dados
     3. FERRAMENTAS— barra, índice, busca, triagem, geradores, ajuda
   A camada de impressão (@media print) reconstrói o documento em A4
   e tem um modo card de bolso, ambos saindo destes mesmos dados.
   ============================================================ */

:root{
  /* paleta institucional */
  --navy:#001333; --navy-mid:#01274E; --navy-alto:#0A2D5C;
  --azul:#0095D9; --azul-esc:#0077AE; --azul-claro:#7FD0F5;
  --vermelho:#D1232D; --vermelho-fundo:#FFF3F3;
  --verde:#1A7444; --verde-claro:#E6F4EC;
  --ambar:#8A6410; --ambar-fundo:#FDF6E3;
  --azul-texto:#00618F;
  --tint:#EBF6FD; --tint-2:#D6EDF9; --linha:#D3DEE9; --linha-forte:#B9CADB;
  --slate:#5A6B84; --slate-claro:#64758C; --papel:#FFFFFF;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --display:Archivo,"Segoe UI",system-ui,sans-serif;
  --barra:56px; --indice:270px; --wrap:47rem;
  --sombra:0 1px 2px rgba(0,19,51,.06),0 8px 24px -12px rgba(0,19,51,.18);
  --sombra-alta:0 18px 50px -12px rgba(0,19,51,.34);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--papel);color:var(--navy);
  font-family:var(--sans);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
img{max-width:100%;height:auto;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--vermelho);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:absolute;left:-999px;top:0;z-index:9999;background:var(--navy);color:#fff;padding:.7rem 1.1rem}
.pular:focus{left:.5rem;top:.5rem}

/* ---------------- barra de ferramentas ---------------- */
/* barra escura: forma um único bloco institucional com a hero navy */
.barra{
  position:fixed;inset:0 0 auto 0;height:var(--barra);z-index:900;
  display:flex;align-items:center;gap:.6rem;padding:0 .8rem;
  background:rgba(0,19,51,.97);backdrop-filter:blur(14px);color:#fff;
  border-bottom:1px solid rgba(255,255,255,.14);
}
.selo-oab{height:26px;width:auto;flex:none;padding-left:.7rem;border-left:1px solid rgba(255,255,255,.2)}

/* estado da trilha: rótulo em cima, valor embaixo — informação, não botão */
.barra-trilha{
  display:flex;align-items:center;gap:.55rem;flex:none;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:.3rem .35rem .3rem .7rem;
}
.trilha-estado{min-width:0;line-height:1.15}
.trilha-estado u{
  display:block;text-decoration:none;font-family:var(--display);font-weight:700;
  font-size:.58rem;letter-spacing:.11em;text-transform:uppercase;color:#8FA6C0;
}
.trilha-estado s{display:flex;align-items:center;gap:.32rem;text-decoration:none;margin-top:.12rem}
.trilha-estado s .ico{width:.85rem;height:.85rem;color:#4ED08A;flex:none}
.trilha-estado i{
  font-style:normal;font-size:.8rem;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14rem;display:block;
}
.bt-trocar{height:32px;min-width:32px;padding:0 .55rem;font-size:.72rem}

/* busca como campo de verdade, no lugar de um ícone a decifrar */
.busca-barra{flex:1;max-width:22rem;min-width:8rem;margin-left:auto}
.busca-barra .busca{
  height:36px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);
  color:#fff;padding-right:2.2rem;
}
.busca-barra .busca::placeholder{color:#8FA6C0}
.busca-barra .busca:focus{background:rgba(255,255,255,.14);border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,149,217,.28)}
.busca-barra .busca-ico{color:#8FA6C0}
.busca-tecla{
  position:absolute;right:.55rem;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:.66rem;color:#8FA6C0;
  border:1px solid rgba(255,255,255,.22);border-radius:5px;padding:.05rem .32rem;pointer-events:none;
}
.busca-barra .resultados{left:0;right:0}

@media (max-width:1180px){
  .selo-oab,.barra-marca b,.busca-tecla{display:none}
  .trilha-estado i{max-width:9rem}
  .busca-barra{max-width:16rem}
}
@media (max-width:860px){
  .trilha-estado{display:none}
  .barra-trilha{padding:0;background:none;border:0}
  .busca-barra{max-width:none}
}
@media (max-width:600px){
  .busca-barra .busca{padding-left:2rem;font-size:.8rem}
  .busca-barra .busca::placeholder{content:"Buscar"}
}

/* fólio: identifica o documento em cada página impressa; invisível na tela */
.barra-marca{display:flex;align-items:center;gap:.7rem;min-width:0;margin-right:auto}
/* escudo da Comissão na barra: a marca, não um selo de texto */
.selo{width:auto;height:36px;flex:none;display:block}
/* o nome na barra repete a assinatura da capa: navy + "PJe" em azul */
.barra-marca b{
  display:block;font-family:var(--display);font-weight:800;font-size:1rem;
  letter-spacing:-.015em;line-height:1.15;color:#fff;white-space:nowrap;
}
.barra-marca b em{font-style:normal;color:#4FC3F7}
@media (max-width:520px){.barra-marca b{font-size:.95rem}}
.barra-marca span{display:block;font-family:var(--mono);font-size:.6rem;color:var(--slate);letter-spacing:.06em;margin-top:2px}
.barra-progresso{display:flex;align-items:center;gap:.55rem;min-width:150px}
.mini-barra{width:88px;height:5px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.mini-barra i{display:block;height:100%;width:0;background:var(--azul);transition:width .35s ease}
.mini-barra i.completo{background:#4ED08A}
.barra-progresso span{font-family:var(--mono);font-size:.68rem;color:#B7C8DC;white-space:nowrap}
.bt{
  height:38px;min-width:38px;padding:0 .7rem;border-radius:9px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);color:#E6EEF7;display:inline-flex;align-items:center;gap:.4rem;
  font-size:.76rem;font-weight:600;letter-spacing:.01em;transition:.16s;white-space:nowrap;
}
.bt:hover{background:rgba(255,255,255,.16);border-color:#7FD0F5;color:#fff}
.bt[aria-pressed="true"]{background:var(--azul-esc);border-color:var(--azul-esc);color:#fff}
.bt-p{background:var(--azul-esc);border-color:var(--azul-esc);color:#fff}
.bt-p:hover{background:var(--azul-texto);color:#fff}
/* ícones: tamanho relativo à fonte do elemento, cor herdada */
.ico{width:1.15em;height:1.15em;display:block;flex:none}
.bt .ico{width:1.2rem;height:1.2rem}
.ico-porta{width:1.7rem;height:1.7rem;margin-bottom:.55rem;color:#7FD0F5}
.porta:last-child .ico-porta{color:#FF8A93}
.pare-tempo .ico{width:.95em;height:.95em;display:inline-block;vertical-align:-.15em;margin-right:.3em}
.leg-bt{display:inline-flex;align-items:center;gap:.35rem}
.leg-bt .ico{width:.95rem;height:.95rem}
.canal-l .ico{width:1.15rem;height:1.15rem;color:var(--azul);margin-top:.1rem}
.canal-zap .ico{width:1.05rem;height:1.05rem}
.bt-inicio .ico{width:1.15rem;height:1.15rem;color:#7FD0F5}
.bt-inicio.destaque-inicio .ico{color:var(--azul-esc)}
.bt-rot{display:inline}
/* par de botões de dispositivo, colados como um segmento único */
.grupo-disp{display:flex;flex:none;border:1px solid rgba(255,255,255,.18);border-radius:9px;overflow:hidden;background:rgba(255,255,255,.06)}
.grupo-disp .bt{border:0;border-radius:0;background:none;height:36px}
.grupo-disp .bt+.bt{border-left:1px solid rgba(255,255,255,.16)}
.grupo-disp .bt[aria-pressed="true"]{background:var(--azul-esc);color:#fff}
@media (max-width:1180px){.bt-rot{display:none}.barra-progresso{min-width:0}.mini-barra{width:54px}}
@media (max-width:760px){.grupo-disp{display:none}}
/* em tela estreita o índice vira gaveta que sobe de baixo, na zona do polegar */
@media (max-width:760px){
  .indice{
    left:0;right:0;top:auto;bottom:0;width:auto;height:min(72dvh,560px);
    border-right:0;border-top:1px solid var(--linha);border-radius:16px 16px 0 0;
    box-shadow:var(--sombra-alta);transform:translateY(0);
  }
  body:not(.com-indice) .indice{transform:translateY(110%)}
  .indice-topo::before{
    content:"";display:block;width:2.4rem;height:4px;border-radius:99px;
    background:var(--linha-forte);margin:0 auto .6rem;
  }
}
@media (max-width:640px){.barra-marca span{display:none}.barra-progresso span{display:none}}

/* ---------------- índice lateral ---------------- */
.indice{
  position:fixed;left:0;top:var(--barra);bottom:0;width:var(--indice);z-index:850;
  background:#F7FAFC;border-right:1px solid var(--linha);
  display:flex;flex-direction:column;transform:translateX(0);visibility:visible;
  transition:transform .22s ease,visibility 0s linear 0s;
}
body:not(.com-indice) .indice{transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.indice-topo{padding:.9rem 1rem .7rem;border-bottom:1px solid var(--linha)}
.indice-topo b{font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--slate)}
.busca-caixa{position:relative;margin-top:.6rem}
.busca-ico{position:absolute;left:.62rem;top:50%;transform:translateY(-50%);width:1.05rem;height:1.05rem;color:var(--slate-claro);pointer-events:none}
.busca{
  width:100%;height:38px;padding:0 .6rem 0 2rem;border:1px solid var(--linha-forte);
  border-radius:9px;background:#fff;font:inherit;font-size:.86rem;color:var(--navy);
}
.busca:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,149,217,.18)}
.indice-lista{flex:1;overflow-y:auto;padding:.5rem .55rem 1.2rem}
.indice-item{
  display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;align-items:center;width:100%;
  min-height:44px;padding:.5rem .6rem;border:0;background:none;border-radius:8px;text-align:left;
  color:var(--navy);text-decoration:none;transition:.14s;
}
.indice-item:hover{background:var(--tint)}
.indice-item[aria-current="true"]{background:var(--tint-2);box-shadow:inset 3px 0 0 var(--azul)}
.indice-item u{
  text-decoration:none;font-family:var(--mono);font-size:.62rem;color:var(--slate);
  width:1.5rem;flex:none
}
.indice-item s{text-decoration:none;font-size:.83rem;font-weight:600;line-height:1.25}
.indice-item em{
  font-style:normal;font-family:var(--mono);font-size:.6rem;color:var(--slate);
  background:#fff;border:1px solid var(--linha);border-radius:99px;padding:.1rem .38rem
}
.indice-item em.ok{background:var(--verde-claro);border-color:#BFE3CE;color:var(--verde)}
.indice-rodape{padding:.7rem 1rem;border-top:1px solid var(--linha);font-family:var(--mono);font-size:.6rem;color:var(--slate-claro);line-height:1.5}

/* ---------------- documento ---------------- */
.doc{
  padding-top:var(--barra);margin-left:0;transition:margin-left .22s ease;
}
body.com-indice .doc{margin-left:var(--indice)}
@media (max-width:1080px){
  body.com-indice .doc{margin-left:0}
  .indice{box-shadow:var(--sombra-alta)}
}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 1.35rem}

/* hero navy: o bloco institucional que abre o documento */
.capa{
  background:var(--navy);color:#fff;padding:3.4rem 0 2.8rem;position:relative;overflow:hidden;
}
.capa::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 60% at 82% 4%,rgba(0,149,217,.34),transparent 62%),
             radial-gradient(55% 55% at 2% 100%,rgba(209,35,45,.16),transparent 60%);
}
.capa .wrap{position:relative}
/* a assinatura da Comissão substitui a linha de texto que dizia o mesmo */
.marca-capa{width:auto;height:clamp(58px,9vw,84px);margin:0 0 1.4rem}
.marcas-rodape{display:flex;align-items:center;gap:1.1rem;margin:0 0 1.4rem;flex-wrap:wrap}
.marca-rodape{width:auto;height:52px;margin:0}
.marca-rodape-oab{height:44px;padding-left:1.1rem;border-left:1px solid var(--linha)}
.marca-card{width:auto;height:52px;margin:0 0 .7rem}
.capa h1{
  font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3.05rem);
  line-height:1.03;letter-spacing:-.025em;margin:0 0 .9rem;color:#fff;
}
.capa h1 em{font-style:normal;color:#4FC3F7}
.lede{font-size:1.05rem;color:#C9D6E6;margin:0;max-width:34rem}

/* partida do guia, na capa — sempre visível, não depende do que está gravado */
.inicio{margin-top:2rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,.18)}
.inicio-tit{
  font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;
  color:#8FA6C0;margin:0 0 .8rem;
}
.inicio-bts{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:.6rem}
.bt-inicio{
  display:flex;align-items:center;gap:.7rem;text-align:left;padding:.75rem .9rem;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.24);border-radius:10px;
  color:#fff;transition:.16s;
}
.bt-inicio:hover{background:rgba(255,255,255,.18);border-color:#7FD0F5;transform:translateY(-1px)}
.bt-inicio b{display:block;font-size:.86rem;font-weight:600;line-height:1.25}
.bt-inicio small{display:block;font-size:.72rem;color:#A9C0D8;margin-top:.12rem;line-height:1.3}
.bt-inicio.destaque-inicio{background:#fff;border-color:#fff;color:var(--navy)}
.bt-inicio.destaque-inicio small{color:var(--slate)}
.bt-inicio.destaque-inicio:hover{background:#E7F1F9;color:var(--navy)}
@media print{.inicio,.portas{display:none}}

/* ---- portas de entrada por trilha ---- */
.portas{margin-top:2.2rem;padding-top:1.7rem;border-top:1px solid rgba(255,255,255,.18)}
.portas-tit{
  font-family:var(--display);font-weight:800;color:#fff;
  font-size:clamp(1.35rem,3.6vw,1.75rem);line-height:1.15;letter-spacing:-.015em;
  margin:0 0 .35rem;display:flex;align-items:center;gap:.7rem;
}
.portas-tit::before{
  content:"";width:.7rem;height:1.5rem;border-radius:3px;flex:none;
  background:linear-gradient(180deg,var(--azul) 50%,var(--vermelho) 50%);
}
.portas-sub{font-size:.95rem;color:#B7C8DC;margin:0 0 1.15rem;max-width:36rem}
.portas-bts{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:.8rem}
.porta{
  display:block;text-align:left;padding:1.1rem 1.15rem;border-radius:13px;position:relative;
  background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.26);color:#fff;transition:.18s;
  overflow:hidden;
}
.porta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#0095D9}
.porta:last-child::before{background:#FF6B75}
.porta:hover{border-color:#7FD0F5;background:rgba(255,255,255,.18);transform:translateY(-2px)}
.porta:last-child:hover{border-color:#FF8A93;background:rgba(209,35,45,.18)}
.porta b{display:block;font-family:var(--display);font-size:1.02rem;font-weight:700;line-height:1.2}
.porta span{display:block;font-size:.86rem;color:#E7F1F9;margin-top:.25rem}
.porta small{display:block;font-size:.75rem;color:#A9C0D8;margin-top:.55rem;line-height:1.45}
body.sem-trilha .barra-progresso{visibility:hidden}
.bt-trilha{max-width:230px;overflow:hidden}
.bt-trilha .bt-rot{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- etapas do protocolo P.A.R.E. ---- */
.pare-lista{margin-top:1.4rem}
.pare-etapa{
  border:1px solid var(--linha);border-radius:12px;padding:1.2rem 1.25rem;margin-bottom:1.1rem;
  background:#FFF7F7;border-color:rgba(209,35,45,.2);
  box-shadow:var(--sombra);scroll-margin-top:calc(var(--barra) + 1rem);
}
.pare-cab{
  display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;
  margin:-1.2rem -1.25rem .9rem;padding:1rem 1.25rem;
  background:linear-gradient(90deg,rgba(209,35,45,.12),rgba(209,35,45,.03));
  border-bottom:1px solid rgba(209,35,45,.2);
}
/* a letra em vermelho: P.A.R.E. é, antes de tudo, uma ordem de parar */
.pare-letra{
  width:3rem;height:3rem;border-radius:12px;display:grid;place-items:center;
  background:var(--vermelho);color:#fff;
  font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1;
}
.pare-etapa{border-top:3px solid var(--vermelho)}
.pare-tit h3{margin:0;font-size:1.15rem;font-family:var(--display)}
.pare-tit p{margin:.2rem 0 0;font-size:1rem;color:var(--navy-mid);line-height:1.4;font-weight:500}
.pare-tempo{
  font-family:var(--mono);font-weight:600;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;
  background:var(--tint);color:var(--azul-texto);border-radius:99px;padding:.3rem .65rem;white-space:nowrap;
}
.pare-etapa .lista{margin-top:.9rem;background:#fff}
@media (max-width:520px){
  .pare-cab{grid-template-columns:auto 1fr}
  .pare-tempo{grid-column:2;justify-self:start;margin-top:.3rem}
  .pare-letra{width:2.5rem;height:2.5rem;font-size:1.3rem}
}

/* ---- passos numerados ---- */
.passos{list-style:none;counter-reset:passo;margin:1.2rem 0;padding:0}
.passos li{
  counter-increment:passo;position:relative;padding:.2rem 0 .9rem 2.6rem;
  border-left:2px solid var(--azul);margin-left:.9rem;
}
.passos li:last-child{border-left-color:transparent;padding-bottom:0}
.passos li::before{
  content:counter(passo);position:absolute;left:-1.05rem;top:0;
  width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;
  background:var(--azul-esc);color:#fff;font-family:var(--mono);font-size:.8rem;font-weight:600;
}
.passos b{display:block;font-weight:600;font-size:.98rem}
.passos small{display:block;color:var(--slate);font-size:.88rem;margin-top:.2rem;line-height:1.5}

/* ---- lista de canais ---- */
.canais{display:grid;gap:.5rem;margin:1.2rem 0}
.canal-l{
  display:grid;grid-template-columns:auto 1fr;gap:.75rem;align-items:start;
  border:1px solid var(--linha);border-left:4px solid var(--azul);
  border-radius:0 9px 9px 0;padding:.75rem .85rem;background:#fff;
}
.canal-l b{display:block;font-size:.9rem}
.canal-l>div>span{display:block;font-family:var(--mono);font-size:.88rem;font-weight:600;margin-top:.15rem}
.canal-l small{display:block;color:var(--slate);font-size:.8rem;margin-top:.2rem;line-height:1.45}

.canal-zap{
  display:inline-flex;align-items:center;gap:.45rem;margin:.5rem .6rem .2rem 0;
  background:var(--verde);color:#fff!important;border-radius:9px;padding:.5rem .85rem;
  font-weight:600;font-size:.95rem;text-decoration:none;
}
.canal-zap:hover{background:#146038;color:#fff!important}
.bt-zap{background:var(--verde);border-color:var(--verde);color:#fff}
.bt-zap:hover{background:#146038;border-color:#146038;color:#fff}
.fonte-tabela{font-size:.78rem;color:var(--slate);margin:-.5rem 0 1rem}
.tabela-caixa.comparativo td:first-child{font-family:var(--sans);font-weight:600;white-space:normal;color:var(--navy)}
.res-outra{color:var(--ambar);font-weight:600}
@media print{
  .pare-etapa{break-inside:avoid;box-shadow:none}
  .passos li{break-inside:avoid}
  .canal-l{break-inside:avoid}
}

main{padding:2.4rem 0 1rem}
.secao{margin:0 0 3.1rem;scroll-margin-top:calc(var(--barra) + 1rem)}
/* chapéu de seção: sai da monoespaçada e ganha peso, régua e tamanho legível */
.etapa-num{
  font-family:var(--display);font-weight:700;font-size:.84rem;letter-spacing:.085em;
  text-transform:uppercase;color:var(--azul-texto);margin:0 0 .55rem;
  display:flex;align-items:center;gap:.6rem;
}
.etapa-num::before{content:"";width:1.7rem;height:3px;background:var(--azul);border-radius:2px;flex:none}
.secao h2{font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,4.5vw,1.78rem);line-height:1.14;letter-spacing:-.015em;margin:0 0 .7rem}
.secao h3{
  font-family:var(--display);font-weight:700;font-size:1.02rem;margin:1.7rem 0 .5rem;
  padding-left:.7rem;border-left:4px solid var(--azul);color:var(--navy-mid);
}
p{margin:0 0 .9rem}
a{color:#0563C1;text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--navy)}
/* faixa azul no cabeçalho da seção: a cor que estrutura a leitura da página */
.secao-cab{
  background:var(--tint);
  border:1px solid rgba(0,149,217,.2);border-left:5px solid var(--azul);
  border-radius:0 10px 10px 0;
  padding:.9rem 1.1rem 1rem;margin:0 0 1.3rem -1.1rem;
}
.secao-cab .etapa-num{margin-bottom:.35rem}
.secao-cab h2{margin:0}
.regua{display:none}

/* ---------------- checklist ---------------- */
.lista{list-style:none;margin:1.1rem 0 0;padding:0;border:1px solid var(--linha);border-radius:10px;overflow:hidden;background:#fff}
/* alvos de toque: a linha inteira respeita 48px e o quadrado de marcar
   tem área de acerto de 44px, ampliada por pseudo-elemento sem inflar o desenho */
/* a cor do item comunica estado, não enfeite:
   pendente é neutro, feito é verde, não-aplicável recua para cinza */
.item{
  border-bottom:1px solid var(--linha);padding:.75rem .9rem .75rem .85rem;min-height:48px;
  display:grid;grid-template-columns:auto 1fr auto;gap:.85rem;align-items:start;
  border-left:4px solid var(--tint-2);
  transition:background .16s,border-color .16s,opacity .18s;
}
/* linhas alternadas: a lista se lê como tabela, não como texto solto */
.item:nth-child(odd){background:var(--tint)}
.item:hover{background:var(--tint-2);border-left-color:var(--azul)}
.item.feito{background:var(--verde-claro);border-left-color:var(--verde)}
.item.feito:hover{background:#DCEFE4}
.item.na{opacity:.5;background:#F7FAFC;border-left-color:var(--linha-forte)}
.item.na:hover{background:#F1F5F8}
.lista .item:last-child{border-bottom:0}
.marca{
  appearance:none;-webkit-appearance:none;flex:none;margin:.1rem 0 0;
  width:1.5rem;height:1.5rem;border:2px solid var(--azul);border-radius:6px;
  background:#fff;cursor:pointer;position:relative;transition:.15s;
}
/* área de acerto de 44px em volta do quadrado, invisível */
.marca::before{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;
}
.marca:hover{border-color:var(--verde)}
.marca:checked{background:var(--verde);border-color:var(--verde)}
.marca:checked::after{
  content:"";position:absolute;left:.44rem;top:.16rem;width:.3rem;height:.64rem;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)
}
.item-txt{cursor:pointer;min-width:0}
.item-txt b{font-weight:600;display:block}
.item-txt small{display:block;color:var(--slate);font-size:.88rem;margin-top:.15rem;line-height:1.5}
.item.feito .item-txt b{color:var(--verde)}
.item.feito .item-txt small{color:#4A7A5E}
.item.na .item-txt b{text-decoration:line-through}
.bt-na{
  border:1px solid var(--linha-forte);background:#F7FAFC;border-radius:8px;
  min-width:44px;height:44px;padding:0 .7rem;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:.7rem;font-weight:600;color:var(--slate);
  align-self:center;transition:.15s;white-space:nowrap;
}
.bt-na:hover{border-color:var(--azul);color:var(--azul-esc);background:var(--tint)}
.item.na .bt-na{background:var(--navy);border-color:var(--navy);color:#fff}

/* legenda dos controles, uma vez, onde a primeira lista aparece */
.legenda{
  border:1px solid var(--linha);border-left:5px solid var(--linha-forte);
  border-radius:0 10px 10px 0;background:#F7FAFC;
  padding:.9rem 1rem;margin:1.2rem 0 .2rem;
}
.legenda-tit{
  font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;
  color:var(--slate);margin:0 0 .8rem;
}
.legenda-l{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:center;font-size:.85rem;line-height:1.45}
.legenda-l+.legenda-l{margin-top:.6rem}
.leg-ck{
  width:1.35rem;height:1.35rem;border-radius:5px;background:var(--azul);position:relative;display:block;flex:none;
}
.leg-ck::after{
  content:"";position:absolute;left:.42rem;top:.16rem;width:.28rem;height:.6rem;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg);
}
.leg-na{
  border:1px solid var(--linha-forte);background:#fff;border-radius:99px;padding:.22rem .55rem;
  font-size:.66rem;font-weight:600;color:var(--slate);white-space:nowrap;
}
.leg-bt{
  background:var(--navy);color:#fff;border-radius:8px;padding:.28rem .55rem;
  font-size:.66rem;font-weight:600;white-space:nowrap;
}
@media (max-width:520px){
  .legenda-l{grid-template-columns:1fr;gap:.3rem}
  .legenda-l>span:first-child{justify-self:start}
}

/* ---------------- cartões de tribunal ---------------- */
.tribunais{display:grid;gap:.9rem;margin:1.2rem 0}
.tribunal{background:var(--tint);border:1px solid rgba(0,149,217,.16);border-radius:11px;padding:1.15rem 1.2rem}
.tribunal.oculto{display:none}
.tribunal h3{margin:0 0 .55rem;display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;font-size:1.02rem}
.tag{
  font-family:var(--mono);font-size:.62rem;letter-spacing:.07em;background:var(--azul-esc);
  color:#fff;padding:.16rem .44rem;border-radius:4px;font-weight:600;
}
.tribunal p{margin:0 0 .55rem;font-size:.95rem}
.tribunal p:last-child{margin-bottom:0}
.dado{font-family:var(--mono);font-size:.88rem;font-weight:600}
.contatos{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.75rem;padding-top:.65rem;border-top:1px solid rgba(0,149,217,.18);font-size:.86rem}
.verificado{font-family:var(--mono);font-size:.7rem;color:var(--slate);letter-spacing:.02em;margin-top:.6rem;display:block}
.verificado.velho{color:var(--ambar)}

/* ---------------- janela de erro ---------------- */
.erro{
  border:1px solid var(--linha);border-radius:11px;overflow:hidden;margin:1rem 0;
  background:#fff;box-shadow:var(--sombra);border-top:3px solid var(--linha-forte);
}
/* a cor do topo repete a etiqueta de camada: dá para varrer a lista sem ler.
   Classe no elemento, e não :has(), que falha em navegador antigo. */
.erro-local{border-top-color:var(--ambar)}
.erro-cadastro{border-top-color:var(--azul)}
.erro-certificadora{border-top-color:var(--vermelho)}
.erro-barra{display:flex;align-items:center;gap:.7rem;padding:.5rem .8rem;background:#EEF3F8;border-bottom:1px solid var(--linha)}
.pontos{display:flex;gap:5px;flex:none}
.pontos i{width:9px;height:9px;border-radius:50%;display:block}
.pontos i:nth-child(1){background:#E06C5B}.pontos i:nth-child(2){background:#E3B85C}.pontos i:nth-child(3){background:#63B96B}
.erro-url{font-family:var(--mono);font-size:.66rem;color:var(--slate);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erro-corpo{padding:1rem 1.1rem 1.1rem}
.tela{
  font-family:var(--mono);font-size:.86rem;line-height:1.45;
  background:var(--tint);color:var(--navy);border-left:4px solid var(--azul);
  padding:.75rem .9rem;border-radius:0 7px 7px 0;display:block;overflow-wrap:break-word;margin:0 0 .8rem;
}
.tela::before{content:"a tela diz  ";color:var(--azul-esc);font-weight:600}
.erro-corpo p{font-size:.95rem;margin:0 0 .6rem}
.erro-corpo p:last-of-type{margin-bottom:0}
.erro-corpo strong{color:var(--navy)}
.camada{
  display:inline-flex;align-items:center;gap:.45rem;font-family:var(--display);font-size:.72rem;
  letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:.26rem .68rem;margin-bottom:.8rem;font-weight:700;
}
.camada::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.camada.local{background:var(--ambar-fundo);color:#8A6410}
.camada.cadastro{background:var(--tint-2);color:var(--azul-texto)}
.camada.certificadora{background:var(--vermelho-fundo);color:var(--vermelho)}
.erro-acao{margin-top:.85rem;padding-top:.75rem;border-top:1px dashed var(--linha);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.erro-canal{font-size:.85rem;color:var(--slate);margin-right:auto}
.erro-canal b{color:var(--navy)}
.bt-claro{
  height:40px;padding:0 .8rem;border-radius:8px;border:1px solid var(--azul);background:#fff;
  color:var(--azul-esc);font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:.35rem;transition:.15s;
}
.bt-claro:hover{background:var(--azul);color:#fff}

/* ---------------- caixas ---------------- */
.alerta{
  border:1px solid rgba(209,35,45,.24);border-left:5px solid var(--vermelho);
  background:var(--vermelho-fundo);padding:1rem 1.1rem;border-radius:0 9px 9px 0;margin:1.4rem 0;
}
.alerta p{margin:0;font-size:.95rem}.alerta p+p{margin-top:.6rem}.alerta b{color:var(--vermelho)}
.nota{
  background:var(--tint);border:1px solid rgba(0,149,217,.22);border-left:5px solid var(--azul);
  border-radius:0 9px 9px 0;padding:1rem 1.1rem 1rem 1.15rem;margin:1.4rem 0;font-size:.95rem;
}
.nota b,.nota strong{color:var(--azul-texto)}
.nota a{color:var(--azul-texto);font-weight:600}
.nota p{margin:0}.nota p+p{margin-top:.6rem}
.destaque{
  border:1px solid var(--linha);border-left:5px solid var(--azul);border-radius:0 9px 9px 0;
  background:#fff;padding:1rem 1.1rem;margin:1.4rem 0;box-shadow:var(--sombra);
}
/* caixa com rótulo: regra prática e leitura de teste ganham o âmbar,
   que no guia já significa "atenção sem urgência" */
.destaque.rotulado{
  background:var(--ambar-fundo);border-color:rgba(138,100,16,.28);border-left-color:var(--ambar);
}
.destaque.rotulado>b{color:var(--ambar)}
.destaque.rotulado b{color:#6E4F0C}
/* a caixa dos canais permanece azul: é encaminhamento, não advertência */
.destaque.canal{background:var(--tint);border-color:rgba(0,149,217,.24);border-left-color:var(--azul)}
.destaque.canal b{color:var(--azul-texto)}
.destaque b{color:var(--navy-mid)}
/* só a caixa de destaque de seção usa rótulo em caixa-alta;
   glossário e FAQ reaproveitam .destaque e precisam do texto normal */
.destaque.rotulado>b{
  display:block;font-family:var(--display);font-weight:700;font-size:.75rem;
  letter-spacing:.04em;text-transform:uppercase;color:var(--slate);margin-bottom:.2rem;
}
.destaque.canal>b{display:block;font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--azul-texto)}
.canal-email{
  display:inline-block;margin:.4rem 0 .5rem;font-family:var(--mono);font-weight:600;
  font-size:1.02rem;color:var(--navy);text-decoration:none;border-bottom:2px solid var(--azul);
  overflow-wrap:anywhere;
}
.canal-email:hover{color:var(--azul-esc)}
.destaque.canal p{margin:0;font-size:.88rem;color:var(--slate)}

/* ---------------- tabela ---------------- */
.tabela-caixa{overflow-x:auto;margin:1.1rem 0;border-radius:9px;border:1px solid var(--linha)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{background:var(--azul-esc);color:#fff;text-align:left;padding:.6rem .75rem;font-family:var(--display);font-weight:700;font-size:.76rem;letter-spacing:.04em;text-transform:uppercase}
td{border-bottom:1px solid var(--linha);padding:.65rem .75rem;vertical-align:top}
tr:last-child td{border-bottom:0}
tr:nth-child(even) td{background:#F7FAFC}
td:first-child{font-family:var(--mono);font-size:.85rem;font-weight:600;white-space:nowrap}
@media (max-width:600px){
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border-bottom:1px solid var(--linha)}
  tr:last-child{border-bottom:0}
  td{border:0;padding:.5rem .75rem}
  td:first-child{padding-bottom:.1rem;color:var(--azul-esc)}
  tr:nth-child(even) td{background:transparent}
}

/* ---------------- rodapé ---------------- */
/* rodapé navy: fecha o documento com o mesmo bloco institucional que o abre */
.rodape{
  background:var(--navy);color:#C9D6E6;padding:2.6rem 0 3rem;margin-top:3.5rem;font-size:.9rem;
  position:relative;
}
.rodape::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 70% at 12% 0%,rgba(0,149,217,.22),transparent 62%);
}
.rodape .wrap{position:relative}
.rodape h3{color:#fff;margin:0 0 .5rem;font-family:var(--display);font-size:1.15rem}
.rodape>.wrap>p:first-of-type{font-size:1rem;color:#C9D6E6}
.rodape a{color:#7FD0F5}
.assina{color:#fff;font-weight:600;margin:1.4rem 0 .15rem}
.fontes{font-size:.76rem;line-height:1.7;color:#8FA6C0;margin-top:1.6rem;padding-top:1.2rem;border-top:1px solid rgba(255,255,255,.16)}
.fontes a{color:#8FA6C0}
.marca-rodape-oab{border-left-color:rgba(255,255,255,.22)!important}

/* ---------------- painéis sobrepostos ---------------- */
.veu{position:fixed;inset:0;background:rgba(0,10,26,.55);backdrop-filter:blur(3px);z-index:950;opacity:0;pointer-events:none;transition:opacity .2s}
.veu.on{opacity:1;pointer-events:auto}
.painel{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:960;background:#fff;
  box-shadow:var(--sombra-alta);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
}
.painel.on{transform:translateX(0)}
.painel-topo{
  display:flex;align-items:center;gap:.8rem;padding:.9rem 1.1rem;
  background:#fff;color:var(--navy);flex:none;border-bottom:3px solid var(--azul);
}
.painel-topo h2{margin:0;font-family:var(--display);font-size:1.05rem;flex:1;min-width:0}
.painel-corpo{flex:1;overflow-y:auto;padding:1.2rem 1.2rem 2.5rem}
.painel-corpo h3{font-family:var(--display);font-size:.95rem;margin:1.4rem 0 .5rem}
.painel-corpo h3:first-child{margin-top:0}
.abas{display:flex;gap:.3rem;padding:.6rem .8rem 0;background:#F7FAFC;border-bottom:1px solid var(--linha);overflow-x:auto;flex:none}
.aba{
  border:1px solid transparent;border-bottom:0;background:transparent;color:var(--slate);
  border-radius:8px 8px 0 0;margin-bottom:-1px;min-height:44px;
  padding:.5rem .8rem;font-size:.78rem;font-weight:600;white-space:nowrap;transition:.15s;
}
.aba:hover{color:var(--azul-esc);background:var(--tint)}
.aba[aria-pressed="true"]{background:#fff;color:var(--navy);border-color:var(--linha);box-shadow:inset 0 3px 0 var(--azul)}

/* formulários dos geradores */
.campo{margin-bottom:.85rem}
.campo label{display:block;font-size:.78rem;font-weight:600;color:var(--navy-mid);margin-bottom:.28rem}
.campo input,.campo select,.campo textarea{
  width:100%;padding:.55rem .7rem;border:1px solid var(--linha-forte);border-radius:8px;
  font:inherit;font-size:.9rem;background:#fff;color:var(--navy);
}
.campo textarea{min-height:80px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--azul-esc);box-shadow:0 0 0 3px rgba(0,149,217,.38)}
.campo [aria-invalid="true"]{border-color:var(--vermelho);box-shadow:0 0 0 3px rgba(209,35,45,.18)}
.campo small{display:block;font-size:.72rem;color:var(--slate);margin-top:.22rem}
.campo-2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media (max-width:520px){.campo-2{grid-template-columns:1fr}}
.saida{
  font-family:var(--mono);font-size:.8rem;line-height:1.6;white-space:pre-wrap;
  background:#F7FAFC;border:1px solid var(--linha);border-radius:9px;padding:.9rem;
  margin-top:.5rem;max-height:340px;overflow-y:auto;
}
.acoes{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.aviso-lgpd{
  font-size:.76rem;color:var(--slate);background:var(--verde-claro);border-radius:8px;
  padding:.6rem .75rem;margin-top:1rem;line-height:1.5;
}
.aviso-lgpd b{color:var(--verde)}

/* resultados de busca */
.resultados{position:absolute;left:.55rem;right:.55rem;top:100%;margin-top:.4rem;background:#fff;border:1px solid var(--linha-forte);border-radius:10px;box-shadow:var(--sombra-alta);max-height:60vh;overflow-y:auto;z-index:20}
.res{display:block;width:100%;text-align:left;border:0;background:none;padding:.6rem .75rem;border-bottom:1px solid var(--linha);transition:.12s}
.res:last-child{border-bottom:0}
.res:hover{background:var(--tint)}
.res u{text-decoration:none;display:block;font-family:var(--display);font-weight:700;font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;color:var(--slate)}
.res s{text-decoration:none;display:block;font-size:.84rem;font-weight:600;margin-top:.12rem;line-height:1.3}
.res p{margin:.15rem 0 0;font-size:.76rem;color:var(--slate);line-height:1.4}
.vazio{padding:1rem .75rem;font-size:.84rem;color:var(--slate);text-align:center}
mark{background:#FFF0A8;color:inherit;border-radius:2px;padding:0 .1em}

.escolhas{display:grid;gap:.55rem;margin:1.1rem 0}
.escolha{
  display:grid;grid-template-columns:auto 1fr;gap:.75rem;align-items:start;
  border:1.5px solid var(--linha);border-radius:11px;padding:.8rem .9rem;cursor:pointer;transition:.15s;
}
.escolha:hover{border-color:var(--azul);background:var(--tint)}
.escolha:has(input:checked){border-color:var(--azul);background:var(--tint);box-shadow:0 0 0 3px rgba(0,149,217,.13)}
.escolha input{width:1.3rem;height:1.3rem;margin:.1rem 0 0;accent-color:var(--azul)}
.escolha b{display:block;font-size:.92rem}
.escolha small{display:block;color:var(--slate);font-size:.8rem;margin-top:.15rem;line-height:1.45}

/* tour guiado */
.tour-veu{position:fixed;inset:0;z-index:970;pointer-events:none}
.tour-veu.on{pointer-events:auto}
.tour-foco{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,10,26,.66);transition:.25s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:971}
.tour-cartao{
  position:fixed;z-index:972;width:min(340px,calc(100vw - 2rem));background:#fff;border-radius:13px;
  padding:1rem 1.1rem 1.05rem;box-shadow:var(--sombra-alta);transition:.25s cubic-bezier(.4,0,.2,1);
}
.tour-cartao h3{margin:0 0 .3rem;font-family:var(--display);font-size:.98rem}
.tour-cartao p{margin:0;font-size:.86rem;color:var(--slate);line-height:1.55}
.tour-pe{display:flex;align-items:center;gap:.5rem;margin-top:.9rem}
.tour-pe span{font-family:var(--mono);font-size:.66rem;color:var(--slate);margin-right:auto}
.tour-dica{margin:.6rem 0 0!important;font-size:.7rem!important;color:var(--slate-claro)!important;text-align:center}

/* aviso flutuante */
.aviso{
  position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,140%);z-index:995;
  background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:99px;font-size:.85rem;
  box-shadow:var(--sombra-alta);transition:transform .25s cubic-bezier(.4,0,.2,1);max-width:90vw;text-align:center;
}
.aviso.on{transform:translate(-50%,0)}
.toast-acao{
  border:1px solid rgba(255,255,255,.45);border-radius:7px;background:none;color:#fff;
  font-weight:600;font-size:.82rem;padding:.35rem .7rem;margin-left:.5rem;min-height:32px;
}
.toast-acao:hover{background:rgba(255,255,255,.14)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

/* ============================================================
   PRÉ-VISUALIZAÇÃO DE DISPOSITIVO
   Enquadra o documento na largura de um celular e força as mesmas
   reduções que as media queries aplicam em tela pequena de verdade.
   Serve para conferir o resultado antes de distribuir o arquivo.
   ============================================================ */
.moldura-rot{
  position:fixed;left:1rem;bottom:1rem;z-index:840;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;background:rgba(1,39,78,.9);border:1px solid rgba(255,255,255,.18);
  border-radius:99px;padding:.3rem .8rem;pointer-events:none;display:none;
}
body.celular .moldura-rot{display:block}
body.celular{background:#E7EDF3}
body.celular:not(.com-indice) .indice{transform:translateX(-100%)}
body.celular.com-indice .indice{box-shadow:var(--sombra-alta)}
body.celular .doc{
  margin-left:auto!important;margin-right:auto;max-width:400px;background:var(--papel);
  border-radius:22px;overflow:hidden;box-shadow:var(--sombra-alta);
  margin-top:2.6rem;margin-bottom:2.5rem;border:7px solid var(--navy-mid);
  padding-top:0;
}
body.celular .doc::before{
  content:"";display:block;height:22px;background:var(--navy-mid);
  border-radius:0 0 12px 12px;width:42%;margin:0 auto 0;position:relative;z-index:5;
}
body.celular .capa{padding:2rem 0 1.8rem}
body.celular .capa h1{font-size:1.9rem}
body.celular .lede{font-size:.95rem}
body.celular .wrap{padding:0 1rem}
body.celular main{padding:1.6rem 0 1rem}
body.celular .secao{margin-bottom:2.2rem}
body.celular .secao h2{font-size:1.3rem}
body.celular .doc{font-size:16px}
/* mesmas reduções das media queries de tela pequena */
body.celular .card-grade,body.celular .card-tri,body.celular .campo-2{grid-template-columns:1fr}
body.celular table,body.celular thead,body.celular tbody,
body.celular tr,body.celular td{display:block;width:100%}
body.celular thead{display:none}
body.celular tr{border-bottom:1px solid var(--linha)}
body.celular td{border:0;padding:.5rem .75rem}
body.celular td:first-child{padding-bottom:.1rem;color:var(--azul-esc)}
body.celular tr:nth-child(even) td{background:transparent}
body.celular .contatos{flex-direction:column;gap:.35rem}
body.celular .item{gap:.65rem}
body.celular .pare-cab{grid-template-columns:auto 1fr}
body.celular .pare-tempo{grid-column:2;justify-self:start;margin-top:.3rem}
body.celular .pare-letra{width:2.5rem;height:2.5rem;font-size:1.3rem}
body.celular .legenda-l{grid-template-columns:1fr;gap:.3rem}
body.celular .tela{font-size:.78rem}
@media (max-width:520px){
  body.celular .doc{border:0;border-radius:0;margin-top:0;margin-bottom:0;max-width:none}
  body.celular .doc::before{display:none}
  body.celular .moldura-rot{display:none}
  body.celular{background:var(--papel)}
}
@media print{.moldura-rot{display:none!important}body.celular .doc{border:0;border-radius:0;max-width:none;margin:0;box-shadow:none}body.celular .doc::before{display:none}}

/* ============================================================
   CAMADA DE PAPEL — A4
   ============================================================ */
@media print{
  @page{size:A4 portrait;margin:14mm 15mm}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{font-size:10pt;line-height:1.45;background:#fff}
  .barra,.indice,.veu,.painel,.tour-veu,.tour-foco,.tour-cartao,.aviso,.pular,
  .bt-na,.marca,.legenda,[data-gerador]{display:none!important}
  .doc{padding-top:0;margin-left:0!important}
  .wrap{max-width:none;padding:0}
  body.sem-trilha #secoes::before{
    content:"Documento não gerado: abra o guia e escolha uma das duas situações na capa antes de imprimir.";
    display:block;border:2pt solid var(--vermelho);color:var(--vermelho);padding:6mm;font-weight:600;margin:8mm 0;
  }
  body.sem-trilha .portas{display:block!important}
  body.sem-trilha .porta{display:block;border:1pt solid #999;margin-bottom:4mm}
  .capa{background:#fff!important;color:#000;padding:0 0 8mm;break-after:page;border-bottom:0}
  .capa h1,.capa h1 em,.lede,.portas-tit,.portas-sub{color:#000!important}
  .capa::before{display:none}
  .marca-capa{height:22mm;margin-bottom:6mm}
  .marcas-rodape{gap:8mm;margin-bottom:5mm}
  .marca-rodape{height:15mm;margin:0}
  .marca-rodape-oab{height:13mm;padding-left:8mm}
  .capa h1{font-size:30pt;color:#000}
  .capa h1 em{color:var(--navy-mid)}
  .lede{color:#333;font-size:12pt}
  main{padding:0}
  .secao{margin-bottom:9mm}
  .secao h2{break-after:avoid}
  .secao .etapa-num{break-after:avoid}
  .secao h2{font-size:15pt}
  .item{grid-template-columns:auto 1fr;break-inside:avoid;padding:2.4mm 0}
  .item::before{content:"☐";font-size:12pt;line-height:1;color:#555}
  .item.feito::before{content:"☑";color:#000}
  .item{background:none!important;border-left:0;padding-left:0;border-bottom:1px solid #ddd}
  .lista{border:0;border-radius:0}
  .secao-cab{background:none!important;border-left:2pt solid #333;padding:0 0 0 3mm;margin:0 0 4mm}
  .pare-cab{background:none!important;border-bottom:1pt solid #999;margin:0 0 3mm;padding:0 0 2mm}
  .pare-etapa{background:#fff!important;border-color:#999}
  .secao h3{border-left:2pt solid #333}
  .item.feito .item-txt b{color:#000}
  .item.na{display:none}
  .item-txt small{font-size:8.6pt}

    {"termo": "DJEN", "definicao": "Diário de Justiça Eletrônico Nacional. Substitui os demais meios de publicação oficial, e é dele que corre o prazo (Res. CNJ 455/2022, art. 11)."},
    {"termo": "Domicílio Judicial Eletrônico", "definicao": "Canal de citação eletrônica e comunicações pessoais, no Portal de Serviços (Res. CNJ 455/2022, art. 18)."},

    {"termo": "Indisponibilidade", "definicao": "Interrupção do sistema do tribunal. Não abrange falha em equipamento, programa ou conexão do próprio usuário (Res. CNJ 185/2013, art. 9º, §1º; Res. CNJ 455/2022, art. 6º, §1º)."},

    {"termo": "PDPJ", "definicao": "Plataforma Digital do Poder Judiciário. Porta de entrada unificada de várias aplicações, entre elas o PJe do TRT8."},

const CHAVE = 'cdd.guia.pje.v3';
const TRIBUNAIS = D.tribunais.map(t => t.id);

const padrao = () => ({ v: 3, trilha: null, perfil: TRIBUNAIS.slice(), itens: {}, ger: {}, ultima: null, semAtalhos: false, apresentado: false, dispositivo: 'desktop' });
let S = padrao();
try {
  const bruto = localStorage.getItem(CHAVE);
  if (bruto) {
    const lido = JSON.parse(bruto);
    if (lido && lido.v === 3) S = Object.assign(padrao(), lido);
  }
} catch (e) { /* modo privativo ou storage bloqueado: segue sem persistir */ }

/* sem sonda nem aviso permanente: se o navegador bloquear o armazenamento
   (janela privativa, file:// restrito), avisa uma única vez, no momento em que
   a primeira marcação falhar — e segue funcionando dentro da aba */
let avisouFalha = false;
const salvar = () => {
  try { localStorage.setItem(CHAVE, JSON.stringify(S)); }
  catch (e) {
    if (!avisouFalha) {
      avisouFalha = true;
      avisar('Este navegador está bloqueando o salvamento. Suas marcações valem só nesta aba.');
    }
  }
};

/* ============================================================
   2. UTILITÁRIOS
   ============================================================ */
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el = (tag, attrs = {}, html = '') => {
  const n = document.createElement(tag);
  for (const k in attrs) { if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k]); }
  if (html) n.innerHTML = html;
  return n;
};
const q = (sel, raiz = document) => raiz.querySelector(sel);
const qq = (sel, raiz = document) => Array.from(raiz.querySelectorAll(sel));
const normalizar = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const dataBR = iso => { if (!iso) return '[informar a data]'; const [a, m, d] = String(iso).split('-'); return (a && m && d) ? `${d}/${m}/${a}` : '[informar a data]'; };
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const mesesDesde = iso => {
  const d = new Date(iso + 'T00:00:00'), n = new Date();
  return (n.getFullYear() - d.getFullYear()) * 12 + (n.getMonth() - d.getMonth());
};
const tribunalPor = id => D.tribunais.find(t => t.id === id);

/* ---- trilhas ----
   A trilha escolhida decide quais seções, quais erros e quais itens contam.
   Enquanto não houver escolha, o documento fica oculto e a capa mostra as portas. */
const trilhaAtual = () => S.trilha;
const secoesVisiveis = () => D.secoes.filter(s => !S.trilha || s.trilhas.includes(S.trilha));
const errosVisiveis = () => D.erros.filter(e => !S.trilha || e.trilha === 'ambas' || e.trilha === S.trilha);
const trilhaPor = id => D.trilhas.find(t => t.id === id);

/* todos os itens do guia, achatados. Seções de protocolo guardam itens dentro das etapas. */
const itensDaSecao = s => s.itens || (s.etapasPare ? s.etapasPare.flatMap(e => e.itens || []) : []);
const ITENS = D.secoes.flatMap(s => itensDaSecao(s).map(i => ({ ...i, secao: s.id, trilhas: s.trilhas })));

/* um item entra na conta se não foi marcado "não se aplica"
   e se pertence a algum tribunal do perfil (ou a nenhum em particular) */
const itemAtivo = it => {
  if (S.itens[it.id] === 'na') return false;
  if (S.trilha && it.trilhas && !it.trilhas.includes(S.trilha)) return false;
  if (!it.tribunais) return true;
  return it.tribunais.some(t => S.perfil.includes(t));
};
const contar = (lista) => {
  const ativos = lista.filter(itemAtivo);
  return { feitos: ativos.filter(i => S.itens[i.id] === 'feito').length, total: ativos.length };
};

/* uma etapa do protocolo: letra grande, tempo estimado e a lista de verificação */
function montarEtapaPare(e) {

    ${e.destaque ? montarDestaque(e.destaque) : ''}
    ${e.alerta ? montarAlerta(e.alerta) : ''}
    ${e.nota ? `<div class="nota"><p>${e.nota}</p></div>` : ''}

function montarCanais() {
  const icone = { whatsapp: 'telefone', tel: 'telefone', email: 'email', link: 'link', texto: 'info' };
  return `<div class="canais">${D.canais.map(c => {
    let alvo = esc(c.contato);
    if (c.tipo === 'link') alvo = `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.contato)}</a>`;
    if (c.tipo === 'email') alvo = `<a href="mailto:${esc(c.contato)}">${esc(c.contato)}</a>`;
    if (c.tipo === 'tel' || c.tipo === 'whatsapp') alvo = `<span class="dado">${esc(c.contato)}</span>`;
    return `
    <div class="canal-l">
      ${ico(icone[c.tipo] || 'info')}
      <div><b>${esc(c.orgao)}</b><span>${alvo}</span><small>${esc(c.para)}</small></div>

  }).join('')}</div>`;
}

function montarSecao(s) {
  let corpo = '';
  if (s.intro) corpo += `<p>${s.intro}</p>`;
  if (s.notaAntes) corpo += `<div class="nota"><p>${s.notaAntes}</p></div>`;
  if (s.passos) corpo += montarPassos(s.passos);
  if (s.etapasPare) corpo += `<div class="pare-lista">${s.etapasPare.map(montarEtapaPare).join('')}</div>`;
  if (s.tipo === 'canais') corpo += montarCanais();
  if (s.tipo === 'aviso') {
    corpo += `<div class="alerta"><p><b>${esc(s.alerta.chamada)}</b></p><p>${esc(s.alerta.corpo)}</p></div>`;
  }
  if (s.tipo === 'tribunais') {
    corpo += `<div class="tribunais">${D.tribunais.map(montarTribunal).join('')}</div>`;
  }
  if (s.tipo === 'erros') {
    corpo += errosVisiveis().map(montarErro).join('');
  }
  if (s.paragrafos) {
    corpo += s.paragrafos.map(p => `<p>${p}</p>`).join('');
  }
  if (s.destaque) corpo += montarDestaque(s.destaque);
  if (s.subtitulo) corpo += `<h3>${esc(s.subtitulo)}</h3>`;
  if (s.legenda) {
    corpo += `
    <div class="legenda">
      <p class="legenda-tit">Como usar a lista abaixo</p>
      <div class="legenda-l">
        <span class="leg-ck" aria-hidden="true"></span>
        <span>Marque conforme for fazendo. O guia grava e você continua de onde parou, mesmo fechando a aba.</span>
      </div>
      <div class="legenda-l">
        <span class="leg-na" aria-hidden="true">não se aplica</span>
        <span>Use quando o item não se aplicar ao seu caso. Ele sai da sua contagem em vez de ficar pendente para sempre. Dá para desfazer.</span>
      </div>
      <div class="legenda-l">
        <span class="leg-bt" aria-hidden="true">${ico('tribunais')} Tribunais</span>
        <span>Lá em cima, diga onde você atua. Os itens dos tribunais que não marcar somem da lista sozinhos.</span>
      </div>
    </div>`;
  }
  if (s.itens) corpo += `<ul class="lista">${s.itens.map(montarItem).join('')}</ul>`;
  if (s.nota) corpo += `<div class="nota"><p>${s.nota}</p></div>`;
  if (s.tabelas) corpo += s.tabelas.map(montarTabela).join('');
  if (s.canal) {
    corpo += `
    <div class="destaque canal">
      <b>${esc(s.canal.rotulo)}</b>
      <a class="canal-zap" href="https://wa.me/${esc(D.meta.whatsappNum)}" target="_blank" rel="noopener">
        ${ico('telefone')} WhatsApp ${esc(D.meta.whatsapp)}
      </a>
      <a class="canal-email" href="mailto:${esc(D.meta.email)}">${esc(D.meta.email)}</a>
      <p>${esc(s.canal.detalhe)}</p>
    </div>`;
  }
  if (s.tipo !== 'aviso' && s.alerta) {
    corpo += montarAlerta(s.alerta);
  }
  if (s.acao) {
    corpo += `<p><button type="button" class="bt-claro" data-gerador="${esc(s.acao.gerador)}">${esc(s.acao.rotulo)}</button></p>`;
  }
  return `
  <section class="secao" id="${esc(s.id)}" aria-labelledby="h-${esc(s.id)}">
    <div class="secao-cab">
      ${s.etapa ? `<p class="etapa-num">${esc(s.etapa)}</p>` : ''}
      <h2 id="h-${esc(s.id)}">${esc(s.titulo)}</h2>
    </div>
    ${corpo}
  </section>`;
}

    return `
    <a class="indice-item" href="#${esc(s.id)}" data-ir="${esc(s.id)}">
      <u>${String(n + 1).padStart(2, '0')}</u>
      <s>${esc(s.curto)}</s>
      ${c && c.total ? `<em class="${ok ? 'ok' : ''}">${ok ? '✓' : c.feitos + '/' + c.total}</em>` : '<em>&nbsp;</em>'}
    </a>`;
  }).join('');
}

function renderProgresso() {
  const { feitos, total } = contar(ITENS);
  const pct = total ? (feitos / total) * 100 : 0;
  pgBarra.style.width = pct + '%';
  pgBarra.classList.toggle('completo', total > 0 && feitos === total);
  pgTexto.textContent = (total && feitos === total)
    ? 'tudo pronto'
    : `${feitos}/${total} (${Math.round(pct)}%)`;
}

/* aplica o perfil de tribunais ao documento */
function aplicarPerfil() {
  qq('[data-tribunal]').forEach(n => n.classList.toggle('oculto', !S.perfil.includes(n.dataset.tribunal)));
  ITENS.filter(i => i.tribunais).forEach(i => {
    const n = q(`[data-item="${i.id}"]`);
    if (n) n.hidden = !i.tribunais.some(t => S.perfil.includes(t));
  });
}

/* redesenha o documento conforme a trilha escolhida.
   Sem trilha, o corpo fica vazio e só as portas da capa aparecem. */
const areaSecoes = q('#secoes');

function renderDocumento() {
  areaSecoes.innerHTML = S.trilha ? secoesVisiveis().map(montarSecao).join('') : '';
  document.body.classList.toggle('sem-trilha', !S.trilha);
  q('#portas').hidden = !!S.trilha;
  q('#inicio').hidden = !S.trilha;
  const bt = q('#barra-trilha');
  bt.hidden = !S.trilha;
  if (S.trilha) {
    const outra = D.trilhas.find(t => t.id !== S.trilha);
    q('#rot-trilha').textContent = trilhaPor(S.trilha).rotulo;
    q('#troca-rot').textContent = 'Ir para: ' + outra.rotulo;
    q('#troca-sub').textContent = outra.sub;
    q('[data-ui="trocar-trilha"]').setAttribute('aria-label', 'Trocar de trilha — você está em: ' + trilhaPor(S.trilha).rotulo);
  }
}

function escolherTrilha(id, avisando) {
  S.trilha = id; salvar();
  renderDocumento(); atualizar();
  if (avisando !== false) anunciar('Trilha: ' + trilhaPor(id).rotulo);
}

function atualizar() { renderIndice(); renderProgresso(); aplicarPerfil(); }

/* marcação de itens */
document.addEventListener('change', ev => {
  const ck = ev.target.closest('.marca');
  if (!ck) return;
  const li = ck.closest('[data-item]');
  const id = li.dataset.item;
  S.itens[id] = ck.checked ? 'feito' : '';
  li.classList.toggle('feito', ck.checked);
  salvar(); renderIndice(); renderProgresso();
});

document.addEventListener('click', ev => {
  const na = ev.target.closest('[data-na]');
  if (!na) return;
  const id = na.dataset.na;
  const li = q(`[data-item="${id}"]`);
  const virou = S.itens[id] !== 'na';
  S.itens[id] = virou ? 'na' : '';
  li.classList.toggle('na', virou);
  li.classList.remove('feito');
  const ck = q('.marca', li);
  ck.checked = false; ck.disabled = virou;
  na.setAttribute('aria-pressed', String(virou));
  na.textContent = virou ? 'voltar à lista' : 'não se aplica';
  salvar(); renderIndice(); renderProgresso();
  const { total } = contar(ITENS);
  avisar(virou
    ? `Item fora da sua contagem — agora são ${total}. Clique de novo para trazer de volta.`
    : `Item de volta à lista — agora são ${total}.`);
});

/* seção ativa no índice */
const marcarAtiva = () => {
  const y = window.scrollY + 120;
  let ativa = D.secoes[0].id;
  for (const s of D.secoes) { const n = document.getElementById(s.id); if (n && n.offsetTop <= y) ativa = s.id; }
  qq('[data-ir]').forEach(a => a.setAttribute('aria-current', String(a.dataset.ir === ativa)));
  if (S.trilha && S.ultima !== ativa) { S.ultima = ativa; salvar(); }
  if (history.replaceState) history.replaceState(null, '', '#' + ativa);
};
let travaScroll = false;
window.addEventListener('scroll', () => {
  if (travaScroll) return;
  travaScroll = true;
  requestAnimationFrame(() => { marcarAtiva(); travaScroll = false; });
}, { passive: true });

/* a busca varre as duas trilhas; o resultado carrega a trilha em que vive,
   para que clicar num achado da outra trilha troque de trilha em vez de falhar */
const secaoDe = id => D.secoes.find(s => s.id === id);
const INDICE_BUSCA = [
  ...D.secoes.map(s => ({ tipo: 'Seção', titulo: s.titulo, texto: (s.intro || '') + (s.paragrafos || []).join(' '), alvo: s.id, trilhas: s.trilhas })),
  ...ITENS.map(i => ({ tipo: 'Item', titulo: i.titulo, texto: i.detalhe || '', alvo: i.secao, item: i.id, trilhas: i.trilhas })),
  ...D.erros.map(e => ({ tipo: 'Mensagem de erro', titulo: e.tela, texto: e.diagnostico + ' ' + e.acao, alvo: e.id, trilhas: e.trilha === 'ambas' ? ['primeiro', 'pare'] : [e.trilha] })),
  ...D.tribunais.map(t => ({ tipo: 'Tribunal', titulo: t.nome, texto: t.paragrafos.join(' ') + ' ' + (t.telefone || '') + ' ' + (t.email || ''), alvo: 'etapa3', trilhas: ['primeiro'] })),
  ...D.canais.map(c => ({ tipo: 'Canal de suporte', titulo: c.orgao, texto: c.contato + ' ' + c.para, alvo: 'comissao', trilhas: ['primeiro', 'pare'] })),
  ...D.glossario.map(g => ({ tipo: 'Glossário', titulo: g.termo, texto: g.definicao, alvo: '__glossario' })),
  ...D.faq.map(f => ({ tipo: 'Dúvida', titulo: f.p, texto: f.r, alvo: '__faq' }))
].map(x => ({ ...x, chave: normalizar(x.titulo + ' ' + x.texto) }));

const campoBusca = q('.busca'), caixaRes = q('#resultados');

const realcar = (txt, termo) => {
  if (!termo) return esc(txt);
  const i = normalizar(txt).indexOf(termo);
  if (i < 0) return esc(txt);
  return esc(txt.slice(0, i)) + '<mark>' + esc(txt.slice(i, i + termo.length)) + '</mark>' + esc(txt.slice(i + termo.length));
};

campoBusca.addEventListener('input', () => {
  const termo = normalizar(campoBusca.value.trim());
  if (termo.length < 2) { caixaRes.hidden = true; campoBusca.setAttribute('aria-expanded', 'false'); return; }
  const achados = INDICE_BUSCA.filter(x => x.chave.includes(termo)).slice(0, 24);
  caixaRes.hidden = false;
  campoBusca.setAttribute('aria-expanded', 'true');
  anunciar(achados.length ? achados.length + ' resultados' : 'Nenhum resultado');
  caixaRes.innerHTML = achados.length
    ? achados.map(a => {
      const fora = S.trilha && a.trilhas && !a.trilhas.includes(S.trilha);
      return `
      <button type="button" class="res" data-alvo="${esc(a.alvo)}" ${a.item ? `data-foco="${esc(a.item)}"` : ''}>
        <u>${esc(a.tipo)}${fora ? ` · <span class="res-outra">${esc(trilhaPor(a.trilhas[0]).rotulo)}</span>` : ''}</u>
        <s>${realcar(a.titulo, termo)}</s>
        ${a.texto ? `<p>${realcar(a.texto.slice(0, 130), termo)}${a.texto.length > 130 ? '…' : ''}</p>` : ''}
      </button>`;
    }).join('')
    : `<div class="vazio">Nada encontrado para “${esc(campoBusca.value)}”.<br>Tente parte da mensagem que apareceu na tela.</div>`;
});

caixaRes.addEventListener('click', ev => {
  const b = ev.target.closest('[data-alvo]');
  if (!b) return;
  caixaRes.hidden = true;
  const alvo = b.dataset.alvo;
  if (alvo === '__glossario') { abrirPainel('ajuda', 'glossario'); return; }
  if (alvo === '__faq') { abrirPainel('ajuda', 'faq'); return; }
  irPara(alvo, b.dataset.foco);
});

function irPara(id, foco) {
  let n = document.getElementById(id);
  /* alvo fora da trilha atual: troca de trilha e tenta de novo, em vez de não fazer nada */
  if (!n) {
    const sec = secaoDe(id) || D.secoes.find(s => D.erros.some(e => e.id === id) && s.tipo === 'erros');
    const destino = sec && sec.trilhas.find(t => t !== S.trilha);
    if (destino) {
      escolherTrilha(destino, false);
      avisar('Isso fica na trilha “' + trilhaPor(destino).rotulo + '”. Troquei para você.');
      n = document.getElementById(id);
    }
    if (!n) return;
  }
  n.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const alvoFoco = n.querySelector('h2') || n;
  alvoFoco.setAttribute('tabindex', '-1');
  alvoFoco.focus({ preventScroll: true });
  const destaque = foco ? q(`[data-item="${foco}"]`) : n;
  if (destaque) {
    destaque.style.transition = 'background .4s';
    destaque.style.background = 'rgba(255,240,168,.6)';
    setTimeout(() => { destaque.style.background = ''; }, 1400);
  }
  if (window.innerWidth <= 1080) fecharIndice();
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-ir]');
  if (a) { ev.preventDefault(); irPara(a.dataset.ir); }
});
document.addEventListener('click', ev => {
  if (!caixaRes.hidden && !ev.target.closest('.busca-caixa')) caixaRes.hidden = true;
});

        `3. Se a falha foi de INTIMAÇÃO, e não de peticionamento, a norma é outra: Res. CNJ 455/2022, arts. 6º a 8º, e a certidão fica no Portal de Serviços, em jus.br, não no PJe do Tribunal.`,
        `Junte o comprovante do chamado, as capturas de tela e a certidão oficial de indisponibilidade.`
      ].join('\n');
    }
  }
};

const painel = q('#painel'), veu = q('#veu');
const painelTitulo = q('#painel-titulo'), painelAbas = q('#painel-abas'), painelCorpo = q('#painel-corpo');

/* rascunho dos geradores: cada tecla é gravada, e fechar o painel — ou a aba —
   não apaga mais o que o colega digitou com prazo correndo */
painelCorpo.addEventListener('input', ev => {
  const n = ev.target;
  if (n.id && /^[gkr]-/.test(n.id)) { S.ger[n.id] = n.value; salvar(); if (n.value.trim()) n.removeAttribute('aria-invalid'); }
});
let ultimoFoco = null;

/* geração do painel: se ele for fechado antes de o requestAnimationFrame
   de abertura rodar, o rAF não pode reaplicar a classe — senão o véu fica
   preso ligado com o painel fechado, travando todos os cliques da página */
let geracaoPainel = 0;

function abrirPainel(qual, aba) {
  ultimoFoco = document.activeElement;
  const minhaGeracao = ++geracaoPainel;
  painel.hidden = false;
  requestAnimationFrame(() => {
    if (minhaGeracao !== geracaoPainel) return;
    painel.classList.add('on'); veu.classList.add('on');
  });
  if (qual === 'ferramentas') renderFerramentas(aba || 'precadastro');
  if (qual === 'ajuda') renderAjuda(aba || 'glossario');
  if (qual === 'perfil') renderPerfil();
  setTimeout(() => { if (minhaGeracao !== geracaoPainel) return; const f = q('input,select,textarea,button', painelCorpo); if (f) f.focus(); }, 240);
}
function fecharPainel() {
  const minhaGeracao = ++geracaoPainel;
  painel.classList.remove('on'); veu.classList.remove('on');
  setTimeout(() => { if (minhaGeracao === geracaoPainel) painel.hidden = true; }, 240);
  if (ultimoFoco) ultimoFoco.focus();
}

    <p class="aviso-lgpd"><b>Nada sai do seu aparelho.</b> O texto é montado aqui, no navegador. Nenhum dado é enviado a servidor, gravado em nuvem ou compartilhado sem que você aperte o botão.</p>`;
  if (navigator.share) q('[data-ui="compartilhar"]').hidden = false;
  /* reidrata o rascunho salvo; campo limpo pelo usuário volta ao padrão */

let textoAtual = '', geradorAtual = null;

document.addEventListener('submit', ev => {
  const f = ev.target.closest('#form-ger');
  if (!f) return;
  ev.preventDefault();
  const g = GERADORES[f.dataset.ger];
  const faltando = (g.obrigatorios || []).filter(sel => !q(sel).value.trim());
  (g.obrigatorios || []).forEach(sel => { const n = q(sel); if (n) n.removeAttribute('aria-invalid'); });
  if (faltando.length) {
    faltando.forEach(sel => { const n = q(sel); if (n) n.setAttribute('aria-invalid', 'true'); });
    q(faltando[0]).focus();
    avisar('Faltam dados obrigatórios. A Comissão e o tribunal não conseguem agir sem eles.');
    return;
  }
  textoAtual = g.montar();
  q('#saida').textContent = textoAtual;
  q('#saida-area').hidden = false;
  q('#saida-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  anunciar('Texto montado.');
});

/* atalhos que não usam data-ui precisam ser tratados antes de qualquer saída antecipada */
document.addEventListener('click', ev => {
  const porta = ev.target.closest('[data-trilha]');
  if (porta) {
    escolherTrilha(porta.dataset.trilha);
    setTimeout(() => { const p = q('#secoes .secao'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 90);
    /* entrada deliberada na trilha calma dispara a apresentação uma única vez */
    if (!S.apresentado && porta.dataset.trilha === 'primeiro') {
      S.apresentado = true; salvar();
      setTimeout(iniciarTour, 900);
    }
    return;
  }
  const ger = ev.target.closest('[data-gerador]');
  if (ger) { abrirPainel('ferramentas', ger.dataset.gerador); return; }
  const abaG = ev.target.closest('[data-ger-aba]');
  if (abaG) { renderFerramentas(abaG.dataset.gerAba); return; }
  const abaA = ev.target.closest('[data-ajuda-aba]');
  if (abaA) { renderAjuda(abaA.dataset.ajudaAba); }
});

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-ui]');
  if (!b) return;
  const acao = b.dataset.ui;

  if (acao === 'indice') { document.body.classList.toggle('com-indice'); b.setAttribute('aria-pressed', String(document.body.classList.contains('com-indice'))); }
  if (acao === 'disp-desktop') dispositivo('desktop');
  if (acao === 'disp-celular') dispositivo('celular');
  if (acao === 'perfil') abrirPainel('perfil');
  if (acao === 'ferramentas') abrirPainel('ferramentas');
  if (acao === 'ajuda') abrirPainel('ajuda');
  if (acao === 'fechar-painel') fecharPainel();
  if (acao === 'imprimir') window.print();

  if (acao === 'copiar') {
    try { await navigator.clipboard.writeText(textoAtual); avisar('Texto copiado.'); }
    catch (e) {
      const ta = el('textarea'); ta.value = textoAtual; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove(); avisar('Texto copiado.');
    }
  }
  if (acao === 'compartilhar') {
    try { await navigator.share({ title: 'Primeiro acesso ao PJe', text: textoAtual }); }
    catch (e) { /* usuário cancelou */ }
  }
  if (acao === 'zap' && geradorAtual && geradorAtual.zap) {
    const corpo = textoAtual.replace(/^Para:.*\nAssunto:.*\n+/, '');
    window.open('https://wa.me/' + geradorAtual.zap + '?text=' + encodeURIComponent(corpo), '_blank', 'noopener');
  }
  if (acao === 'email' && geradorAtual && geradorAtual.destinatario) {
    /* o corpo já traz as linhas Para/Assunto; tira para não duplicar no cliente de e-mail */
    const corpo = textoAtual.replace(/^Para:.*\nAssunto:.*\n+/, '');
    location.href = 'mailto:' + encodeURIComponent(geradorAtual.destinatario)
      + '?subject=' + encodeURIComponent(geradorAtual.assunto || '')
      + '&body=' + encodeURIComponent(corpo);
  }
  if (acao === 'baixar') {
    const url = URL.createObjectURL(new Blob([textoAtual], { type: 'text/plain;charset=utf-8' }));
    const a = el('a', { href: url, download: 'pedido-pje.txt' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  if (acao === 'zerar') {
    if (confirm('Zerar todas as marcações deste guia? Não dá para desfazer.')) {
      S.itens = {}; salvar();
      qq('.marca').forEach(c => { c.checked = false; c.disabled = false; });
      qq('.item').forEach(n => n.classList.remove('feito', 'na'));
      qq('[data-na]').forEach(n => n.setAttribute('aria-pressed', 'false'));
      atualizar(); fecharPainel(); avisar('Progresso zerado.');
    }
  }
  if (acao === 'ir-erro') irPara('diagnostico');
  const cont = ev.target.closest('[data-continuar]');
  if (cont) { caixaAviso.classList.remove('on'); irPara(cont.dataset.continuar); }
  if (acao === 'trocar-trilha') {
    const outra = D.trilhas.find(t => t.id !== S.trilha);
    escolherTrilha(outra.id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    avisar('Agora em: ' + outra.rotulo);
  }
  if (acao === 'tour') { fecharPainel(); window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(iniciarTour, 420); }
  if (acao === 'tour-proximo') passoTour(+1);
  if (acao === 'tour-sair') encerrarTour();
});

document.addEventListener('change', ev => {
  const sa = ev.target.closest('[data-ui="sem-atalhos"]');
  if (sa) { S.semAtalhos = sa.checked; salvar(); return; }
  const p = ev.target.closest('[data-perfil]');
  if (!p) return;
  const id = p.dataset.perfil;
  S.perfil = p.checked ? [...new Set([...S.perfil, id])] : S.perfil.filter(x => x !== id);
  if (!S.perfil.length) { S.perfil = [id]; p.checked = true; avisar('Escolha ao menos um tribunal.'); }
  salvar(); atualizar();
});

veu.addEventListener('click', fecharPainel);

/* aria-modal exige prender o foco: o Tab circula dentro do painel aberto */
painel.addEventListener('keydown', ev => {
  if (ev.key !== 'Tab' || painel.hidden) return;
  const f = qq('button,input,select,textarea,a[href]', painel).filter(n => !n.disabled && n.offsetParent !== null);
  if (!f.length) return;
  const primeiro = f[0], ultimo = f[f.length - 1];
  if (ev.shiftKey && document.activeElement === primeiro) { ev.preventDefault(); ultimo.focus(); }
  else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primeiro.focus(); }
});
const fecharIndice = () => { document.body.classList.remove('com-indice'); q('[data-ui="indice"]').setAttribute('aria-pressed', 'false'); };

/* pré-visualização de dispositivo */
function dispositivo(qual) {
  const celular = qual === 'celular';
  document.body.classList.toggle('celular', celular);
  if (celular) fecharIndice();
  q('[data-ui="disp-desktop"]').setAttribute('aria-pressed', String(!celular));
  q('[data-ui="disp-celular"]').setAttribute('aria-pressed', String(celular));
  S.dispositivo = qual; salvar();
  anunciar(celular ? 'Pré-visualizando na largura de celular.' : 'Largura de computador.');
  if (!tourVeu.hidden) setTimeout(posicionarTour, 60);
}

/* avisos */
const caixaAviso = q('#toast'), regiao = q('#anuncio');
let timerAviso;
function avisar(msg) {
  /* o balão já tem role=status: um único anúncio, sem duplicar na região oculta */
  caixaAviso.textContent = msg; caixaAviso.classList.add('on');
  clearTimeout(timerAviso); timerAviso = setTimeout(() => caixaAviso.classList.remove('on'), 2600);
}
function anunciar(msg) { regiao.textContent = ''; setTimeout(() => { regiao.textContent = msg; }, 60); }

/* teclado */
document.addEventListener('keydown', ev => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    if (ev.key === 'Escape') document.activeElement.blur();
    return;
  }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === 'escape') { if (!painel.hidden) fecharPainel(); else if (!q('#tour-veu').hidden) encerrarTour(); else fecharIndice(); }
  if (S.semAtalhos) return; /* atalhos de tecla única desativáveis; Esc permanece */
  if (k === 'i') { ev.preventDefault(); q('[data-ui="indice"]').click(); }
  if (k === '/') { ev.preventDefault(); campoBusca.focus(); campoBusca.select(); }
  if (k === 'g') { ev.preventDefault(); abrirPainel('ferramentas'); }
  if (k === 'd') { ev.preventDefault(); dispositivo(document.body.classList.contains('celular') ? 'desktop' : 'celular'); }
  if (ev.key === '?') { ev.preventDefault(); abrirPainel('ajuda'); }
  if (k === 'p') { ev.preventDefault(); window.print(); }
});

let iPasso = -1, alvoTour = null, passosAtivos = [];
const tourVeu = q('#tour-veu'), tourFoco = q('#tour-foco'), tourCartao = q('#tour-cartao');

let focoAntesTour = null;
function iniciarTour() {
  if (!S.trilha) { avisar('Escolha primeiro a sua situação.'); return; }
  focoAntesTour = document.activeElement;
  passosAtivos = PASSOS.filter(p => p.trilhas.includes(S.trilha));
  iPasso = -1; tourVeu.hidden = false; tourVeu.classList.add('on');
  passoTour(+1);
  setTimeout(() => tourCartao.focus({ preventScroll: true }), 120);
}
function encerrarTour() {
  tourVeu.hidden = true; tourVeu.classList.remove('on');
  alvoTour = null;
  S.apresentado = true; salvar();
  if (focoAntesTour && focoAntesTour.focus) { focoAntesTour.focus(); focoAntesTour = null; }
}

/* espera a rolagem suave assentar antes de medir o alvo.
   sem isso o retângulo vem de um alvo ainda fora da tela e o cartão
   é posicionado abaixo da dobra, levando os botões junto. */
function aoAssentarScroll(cb) {
  let anterior = null, voltas = 0;
  const checar = () => {
    if (window.scrollY === anterior || voltas > 45) { cb(); return; }
    anterior = window.scrollY; voltas++;
    setTimeout(checar, 40);
  };
  checar();
}

/* posiciona foco e cartão a partir do retângulo vivo do alvo,
   sempre limitado à área visível nos dois sentidos */
function posicionarTour() {
  if (!alvoTour || tourVeu.hidden) return;
  const r = alvoTour.getBoundingClientRect();
  const pad = 8;
  Object.assign(tourFoco.style, {
    left: (r.left - pad) + 'px', top: (r.top - pad) + 'px',
    width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px'
  });
  const cw = tourCartao.offsetWidth, ch = tourCartao.offsetHeight;
  const topoMax = Math.max(12, window.innerHeight - ch - 12);
  const esqMax = Math.max(12, window.innerWidth - cw - 12);
  let topo = r.bottom + 14;
  if (topo > topoMax) topo = r.top - ch - 14;
  topo = Math.min(Math.max(12, topo), topoMax);
  const esq = Math.min(Math.max(12, r.left), esqMax);
  Object.assign(tourCartao.style, { left: esq + 'px', top: topo + 'px' });
}

function passoTour(delta) {
  iPasso += delta;
  if (iPasso >= passosAtivos.length) { encerrarTour(); avisar('Pronto. Bom trabalho.'); return; }
  const p = passosAtivos[iPasso];
  if (p.antes) p.antes();
  setTimeout(() => {
    const alvo = q(p.alvo);
    if (!alvo) { passoTour(+1); return; }
    alvoTour = alvo;
    q('#tour-titulo').textContent = p.titulo;
    q('#tour-texto').textContent = p.texto;
    q('#tour-contador').textContent = `${iPasso + 1} de ${passosAtivos.length} · ${trilhaPor(S.trilha).rotulo}`;
    q('[data-ui="tour-proximo"]').textContent = iPasso === passosAtivos.length - 1 ? 'Concluir' : 'Próximo';
    /* alvo em barra fixa nunca precisa de rolagem */
    const fixo = !!alvo.closest('.barra,.indice,.painel');
    const r0 = alvo.getBoundingClientRect();
    if (!fixo && (r0.top < 90 || r0.bottom > window.innerHeight - 60)) {
      alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    aoAssentarScroll(posicionarTour);
  }, p.antes ? 60 : 20);
}

/* o cartão acompanha rolagem e redimensionamento, e nunca some da tela */
let travaTour = false;
const seguirTour = () => {
  if (tourVeu.hidden || travaTour) return;
  travaTour = true;
  requestAnimationFrame(() => { posicionarTour(); travaTour = false; });
};
window.addEventListener('scroll', seguirTour, { passive: true });
window.addEventListener('resize', seguirTour);

/* saída pelo clique fora: era o que faltava quando o cartão saía da dobra */
tourVeu.addEventListener('click', ev => { if (!ev.target.closest('.tour-cartao')) encerrarTour(); });

/* ============================================================
   10. PARTIDA
   ============================================================ */
/* trilha pela URL: a Comissão pode distribuir o guia como link de socorro
   (…GuiaPJE….html?trilha=pare) e ele abre direto no protocolo, ignorando o
   que estiver gravado. Sem o parâmetro, um #hash compartilhado também resolve
   a trilha na primeira visita, para o deep-link não cair numa capa vazia. */
const trilhaURL = new URLSearchParams(location.search).get('trilha');
if (trilhaURL && D.trilhas.some(t => t.id === trilhaURL)) {
  S.trilha = trilhaURL; salvar();
} else if (!S.trilha && location.hash) {
  const alvoHash = location.hash.slice(1);
  const secHash = secaoDe(alvoHash);
  const erroHash = D.erros.find(e => e.id === alvoHash);
  if (secHash) { S.trilha = secHash.trilhas[0]; salvar(); }
  else if (erroHash) { S.trilha = erroHash.trilha === 'ambas' ? 'pare' : erroHash.trilha; salvar(); }
}
renderDocumento();
atualizar();
if (S.dispositivo === 'celular') dispositivo('celular');
if (window.innerWidth > 1080 && S.dispositivo !== 'celular') document.body.classList.add('com-indice');
q('[data-ui="indice"]').setAttribute('aria-pressed', String(document.body.classList.contains('com-indice')));

if (location.hash && document.getElementById(location.hash.slice(1))) {
  setTimeout(() => irPara(location.hash.slice(1)), 120);
} else {
  /* captura antes de marcarAtiva, que sobrescreve S.ultima com o topo da página */
  const ultimaSalva = S.ultima;
  marcarAtiva();
  /* oferta de retomada: aviso não bloqueante com a última seção visitada */
  setTimeout(() => {
    if (!S.trilha || !ultimaSalva) return;
    const sec = secaoDe(ultimaSalva);
    if (!sec || !sec.trilhas.includes(S.trilha)) return;
    if (secoesVisiveis()[0] && sec.id === secoesVisiveis()[0].id) return;
    caixaAviso.innerHTML = 'Você parou em “' + esc(sec.curto) + '”. ' +
      '<button type="button" class="toast-acao" data-continuar="' + esc(sec.id) + '">Continuar de lá</button>';
    caixaAviso.classList.add('on');
    clearTimeout(timerAviso);
    timerAviso = setTimeout(() => { caixaAviso.classList.remove('on'); }, 9000);
  }, 900);
}

/* apresentação automática só na trilha calma: quem chegou com prazo
   correndo não recebe um véu escuro na frente do socorro */
if (!S.apresentado && S.trilha === 'primeiro') {
  S.apresentado = true; salvar();
  setTimeout(iniciarTour, 600);
}

/* modo card pela URL: ?modo=card */
if (new URLSearchParams(location.search).get('modo') === 'card') document.body.classList.add('modo-card');
})();
</script>
